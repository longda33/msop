# 本机 6GB 物理内存（4 核）。原来的 -Xmx4096m + 1024m Metaspace 是给
# 16GB 机器写的配置，在这台机器上会连同 Kotlin daemon 一起超额订阅，
# 构建过程大量换页到 pagefile（实测峰值 5.4GB），表现为「动不动卡住」。
#
# 现在按机器实际能力配：
#   Gradle daemon 2GB + Kotlin daemon 1.5GB + KSP/AGP 工作进程，留够给系统。
# 代价是全量构建慢一点，换来的是不再假死。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 4 核机器并行收益有限，但保留（模块多，编译与资源处理能重叠）。
org.gradle.parallel=true
org.gradle.caching=true

# daemon 空闲 30 分钟后退出，避免几个 daemon 长期占着 2GB 不放。
org.gradle.daemon.idletimeout=1800000

# Kotlin 编译守护进程单独限堆，否则它会自己再吃 2GB+。
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
